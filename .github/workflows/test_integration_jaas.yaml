# A similar set of tests to test_integration but against a JAAS controller
name: Integration tests with JAAS

# This GitHub action runs your tests for each pull request.
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "project-docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Testing needs read permission and access to Github's container registry to pull JIMM.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ensure project builds before running test
  build:
    name: Build-JAAS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go build -v .

  test:
    name: Integration-JAAS (${{ matrix.jaas.label }})
    needs: build
    runs-on: [self-hosted, jammy, x64]
    strategy:
      fail-fast: false
      matrix:
        jaas:
          - jimm_version: v3.4.4
            juju_channel: 3/stable
            label: "jimm-3-juju-3"
          - jimm_version: v4.0.0-alpha2
            juju_channel: 4.0/stable
            label: "jimm-4-juju-4"
    timeout-minutes: 90
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      # Starting JAAS will start the JIMM controller and dependencies and create a Juju controller on LXD and connect it to JIMM.
      - name: Setup JAAS
        uses: canonical/jimm/.github/actions/test-server@v3
        id: jaas
        with:
          juju-channel: ${{ matrix.jaas.juju_channel }}
          jimm-version: ${{ matrix.jaas.jimm_version }}
          ghcr-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Create additional networks when testing with LXD
        run: |
          sudo lxc network create management-br ipv4.address=10.150.40.1/24 ipv4.nat=true ipv6.address=none ipv6.nat=false
          sudo lxc network create public-br ipv4.address=10.170.80.1/24 ipv4.nat=true ipv6.address=none ipv6.nat=false
      - name: "Create lxd config for bootstrap tests"
        run: ./tools/create_lxd_config.sh
      - name: "Set environment to configure provider"
        # language=bash
        run: |
          CONTROLLER=$(juju whoami --format yaml | yq .controller)
          
          echo "IS_JAAS=true" >> $GITHUB_ENV
          echo "JUJU_AGENT_VERSION=$(juju show-controller | yq .$CONTROLLER.details.agent-version |tr -d '"')" >> $GITHUB_ENV
          echo "JUJU_CONTROLLER_ADDRESSES=$(juju show-controller | yq .$CONTROLLER.details.api-endpoints | yq -r '. | join(",")')" >> $GITHUB_ENV
          echo "JUJU_CLIENT_ID=${{ steps.jaas.outputs.client-id }}"  >> $GITHUB_ENV
          echo "JUJU_CLIENT_SECRET=${{ steps.jaas.outputs.client-secret }}"  >> $GITHUB_ENV
          echo "JUJU_CA_CERT<<EOF" >> $GITHUB_ENV
          echo "${{ steps.jaas.outputs.ca-cert }}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "TEST_MANAGEMENT_BR=10.150.40.0/24" >> $GITHUB_ENV
          echo "TEST_PUBLIC_BR=10.170.80.0/24" >> $GITHUB_ENV
          echo "JUJU_SKIP_FAILED_DELETION=true" >> $GITHUB_ENV
          echo "SKIP_JAAS_GROUP_TEST=true" >> "$GITHUB_ENV"
      - run: go mod download
      # gotestsum re-runs only the tests that failed (at most once, and only
      # when 5 or fewer failed) as a backstop against one-off flakes failing
      # the whole job. Tests that passed on the rerun are flagged in the
      # summary and listed in the uploaded rerun report - a growing report is
      # a flakiness signal to act on, not to ignore.
      - name: Run integration tests
        env:
          TF_ACC: "1"
          TEST_CLOUD: "lxd"
        run: |
          go run gotest.tools/gotestsum@v1.13.0 \
            --format standard-verbose \
            --rerun-fails=1 \
            --rerun-fails-max-failures=5 \
            --rerun-fails-report=rerun-report.txt \
            --packages ./internal/provider/ \
            -- -parallel 4 -timeout 90m -cover
        timeout-minutes: 90
      - name: Upload flaky-test rerun report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerun-report-jaas-${{ strategy.job-index }}
          path: rerun-report.txt
          if-no-files-found: ignore
