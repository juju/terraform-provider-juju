# A similar set of tests to test_integration but against a JAAS controller
name: Integration tests with JAAS

# This GitHub action runs your tests for each pull request.
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "project-docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Testing needs read permission and access to Github's container registry to pull JIMM.
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ensure project builds before running test
  build:
    name: Build-JAAS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go build -v .

  test:
    name: Integration-JAAS (${{ matrix.jaas.label }})
    needs: build
    runs-on: [self-hosted, jammy, x64]
    strategy:
      fail-fast: false
      matrix:
        jaas:
          - jimm_version: v3.6.2
            jimm_action_ref: v3
            juju_channel: 3/stable
            label: "jimm-3-juju-3"
          - jimm_version: v4.0.0-alpha4
            jimm_action_ref: v4
            juju_channel: 4.0/stable
            label: "jimm-4-juju-4"
    timeout-minutes: 90
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
      # Starting JAAS will start the JIMM controller and dependencies and create a Juju controller on LXD and connect it to JIMM.
      # GitHub Actions requires a literal ref in uses, so select the action with if.
      - name: Setup JAAS (JIMM v3)
        if: matrix.jaas.jimm_action_ref == 'v3'
        uses: canonical/jimm/.github/actions/test-server@v3
        id: jaas-v3
        with:
          juju-channel: ${{ matrix.jaas.juju_channel }}
          jimm-version: ${{ matrix.jaas.jimm_version }}
          ghcr-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup JAAS (JIMM v4)
        if: matrix.jaas.jimm_action_ref == 'v4'
        uses: canonical/jimm/.github/actions/test-server@v4
        id: jaas-v4
        with:
          juju-channel: ${{ matrix.jaas.juju_channel }}
          jimm-version: ${{ matrix.jaas.jimm_version }}
          ghcr-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Create additional networks when testing with LXD
        run: |
          sudo lxc network create management-br ipv4.address=10.150.40.1/24 ipv4.nat=true ipv6.address=none ipv6.nat=false
          sudo lxc network create public-br ipv4.address=10.170.80.1/24 ipv4.nat=true ipv6.address=none ipv6.nat=false
      - name: "Create lxd config for bootstrap tests"
        run: ./tools/create_lxd_config.sh
      - name: "Set environment to configure provider"
        shell: bash
        env:
          BACKING_CONTROLLER_NAME: ${{ steps.jaas-v3.outputs.backing-controller-name || steps.jaas-v4.outputs.backing-controller-name }}
          JIMM_CONTROLLER_NAME: ${{ steps.jaas-v3.outputs.jimm-controller-name || steps.jaas-v4.outputs.jimm-controller-name }}
          # Keep provider credentials out of the Juju CLI's login environment during discovery.
          PROVIDER_CLIENT_ID: ${{ steps.jaas-v3.outputs.client-id || steps.jaas-v4.outputs.client-id }}
          PROVIDER_CLIENT_SECRET: ${{ steps.jaas-v3.outputs.client-secret || steps.jaas-v4.outputs.client-secret }}
          PROVIDER_CA_CERT: ${{ steps.jaas-v3.outputs.ca-cert || steps.jaas-v4.outputs.ca-cert }}
        run: |
          if [[ -z "$BACKING_CONTROLLER_NAME" ]]; then
            echo "JAAS setup did not report a backing controller name" >&2
            exit 1
          fi
          if [[ -z "$JIMM_CONTROLLER_NAME" ]]; then
            echo "JAAS setup did not report a JIMM controller name" >&2
            exit 1
          fi

          if ! agent_version=$(juju show-controller "$BACKING_CONTROLLER_NAME" --format yaml |
            yq -er '.[strenv(BACKING_CONTROLLER_NAME)].details."agent-version" | select(tag == "!!str" and . != "")'); then
            echo "Could not read the Juju agent version from $BACKING_CONTROLLER_NAME" >&2
            exit 1
          fi
          if ! controller_addresses=$(juju show-controller "$JIMM_CONTROLLER_NAME" --format yaml |
            yq -er '.[strenv(JIMM_CONTROLLER_NAME)].details."api-endpoints" | select(tag == "!!seq" and length > 0) | join(",")'); then
            echo "Could not read the JIMM API endpoints from $JIMM_CONTROLLER_NAME" >&2
            exit 1
          fi

          {
            echo "IS_JAAS=true"
            printf 'JUJU_AGENT_VERSION=%s\n' "$agent_version"
            printf 'JUJU_CONTROLLER_ADDRESSES=%s\n' "$controller_addresses"
            printf 'JUJU_CLIENT_ID=%s\nJUJU_CLIENT_SECRET=%s\n' "$PROVIDER_CLIENT_ID" "$PROVIDER_CLIENT_SECRET"
            printf 'JUJU_CA_CERT<<EOF\n%s\nEOF\n' "$PROVIDER_CA_CERT"
            echo "TEST_MANAGEMENT_BR=10.150.40.0/24"
            echo "TEST_PUBLIC_BR=10.170.80.0/24"
            echo "JUJU_SKIP_FAILED_DELETION=true"
          } >> "$GITHUB_ENV"
      - run: go mod download
      # gotestsum re-runs only the tests that failed (at most once, and only
      # when 5 or fewer failed) as a backstop against one-off flakes failing
      # the whole job. Tests that passed on the rerun are flagged in the
      # summary and listed in the uploaded rerun report - a growing report is
      # a flakiness signal to act on, not to ignore.
      - name: Run integration tests
        env:
          TF_ACC: "1"
          TEST_CLOUD: "lxd"
        run: |
          go run gotest.tools/gotestsum@v1.13.0 \
            --format standard-verbose \
            --rerun-fails=1 \
            --rerun-fails-max-failures=5 \
            --rerun-fails-report=rerun-report.txt \
            --packages ./internal/provider/ \
            -- -parallel 4 -timeout 90m -cover
        timeout-minutes: 90
      - name: Upload flaky-test rerun report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerun-report-jaas-${{ strategy.job-index }}
          path: rerun-report.txt
          if-no-files-found: ignore
